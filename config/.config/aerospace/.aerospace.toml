after-login-command = []

after-startup-command = ['exec-and-forget sketchybar']

exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$(aerospace list-workspaces --focused)',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

accordion-padding = 0

[[on-window-detected]]
if.app-id="com.mitchellh.ghostty"
run= [ "layout tiling" ]

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 15
    inner.vertical =   15
    outer.left =       0
    outer.bottom =     0
    outer.top =        [{monitor."2" = 40}, { monitor."1" = 8}, 0]
    outer.right =      0

[mode.main.binding]
    # cmd-h = []
    cmd-alt-h = []

    alt-shift-r = 'reload-config'
    alt-shift-f = 'macos-native-fullscreen'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
    alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
    alt-h = 'focus left --boundaries-action wrap-around-the-workspace'
    alt-l = 'focus right --boundaries-action wrap-around-the-workspace'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-0 = 'workspace 4'
  

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-0 = 'move-node-to-workspace 4'

    ctrl-alt-shift-k = 'move-workspace-to-monitor up --wrap-around'
    ctrl-alt-shift-j = 'move-workspace-to-monitor down --wrap-around'
    ctrl-alt-shift-h = 'move-workspace-to-monitor left --wrap-around'
    ctrl-alt-shift-l = 'move-workspace-to-monitor right --wrap-around'

